<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Professional Polish: SEO + social preview (TODO: update text and og:image/url after content is final) -->
  <title>David Nahlik | Portfolio</title>
  <meta name="description" content="Personal portfolio of David Nahlik: projects, awards, skills, and contact information." />
  <meta name="author" content="David Nahlik" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="David Nahlik | Portfolio" />
  <meta property="og:description" content="Projects, awards, skills, and contact information." />
  <meta property="og:image" content="assets/img/og_image.svg" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />

  <!-- Apply saved theme before paint to avoid a flash (kept external for a strict CSP) -->
  <script src="js/theme_init.js?v=2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css?v=2" />
  <link rel="stylesheet" href="css/base.css?v=2" />
  <link rel="stylesheet" href="css/sections.css?v=2" />
  <link rel="stylesheet" href="css/blueprint.css?v=2" />
  <link rel="stylesheet" href="css/responsive.css?v=2" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ============ BLUEPRINT DRAWINGS (decorative background) ============
       Line art that "draws" itself on a loop. Styles/animation live in
       css/blueprint.css. Each shape uses pathLength="1" for the pen effect;
       classes s1–s6 stagger the strokes within a drawing. -->
  <div class="blueprint" aria-hidden="true">
    <!-- Spur gear with centerlines and diameter dimension -->
    <svg class="bp-drawing bp-gear" viewBox="0 0 200 215">
      <path class="bp-line s1" pathLength="1" d="M166.0 100.0 L179.6 107.5 L178.1 117.5 L162.8 120.4 L157.2 133.0 L165.2 146.3 L158.9 154.2 L144.2 149.0 L133.0 157.2 L133.3 172.7 L123.9 176.3 L113.7 164.6 L100.0 166.0 L92.5 179.6 L82.5 178.1 L79.6 162.8 L67.0 157.2 L53.7 165.2 L45.8 158.9 L51.0 144.2 L42.8 133.0 L27.3 133.3 L23.7 123.9 L35.4 113.7 L34.0 100.0 L20.4 92.5 L21.9 82.5 L37.2 79.6 L42.8 67.0 L34.8 53.7 L41.1 45.8 L55.8 51.0 L67.0 42.8 L66.7 27.3 L76.1 23.7 L86.3 35.4 L100.0 34.0 L107.5 20.4 L117.5 21.9 L120.4 37.2 L133.0 42.8 L146.3 34.8 L154.2 41.1 L149.0 55.8 L157.2 67.0 L172.7 66.7 L176.3 76.1 L164.6 86.3 Z"/>
      <circle class="bp-line s2" pathLength="1" cx="100" cy="100" r="24"/>
      <path class="bp-line s3" pathLength="1" d="M100 88 a12 12 0 1 0 0.01 0 M96 88.7 V83 H104 V88.7"/>
      <path class="bp-dim s4" pathLength="1" d="M100 8 V192 M8 100 H192"/>
      <path class="bp-dim s5" pathLength="1" d="M20 200 H180 M20 194 V206 M180 194 V206 M26 197 L20 200 L26 203 M174 197 L180 200 L174 203"/>
      <text class="bp-label" x="100" y="213" text-anchor="middle">Ø160</text>
    </svg>

    <!-- L-bracket with holes, fillet, and dimensions -->
    <svg class="bp-drawing bp-bracket" viewBox="0 0 250 190">
      <path class="bp-line s1" pathLength="1" d="M30 150 H230 V130 H82 A12 12 0 0 1 70 118 V30 H30 Z"/>
      <circle class="bp-line s2" pathLength="1" cx="50" cy="60" r="8"/>
      <circle class="bp-line s2" pathLength="1" cx="50" cy="100" r="8"/>
      <circle class="bp-line s3" pathLength="1" cx="130" cy="140" r="5"/>
      <circle class="bp-line s3" pathLength="1" cx="195" cy="140" r="5"/>
      <path class="bp-dim s4" pathLength="1" d="M30 155 V178 M230 155 V178 M30 172 H230 M36 169 L30 172 L36 175 M224 169 L230 172 L224 175"/>
      <path class="bp-dim s5" pathLength="1" d="M25 30 H6 M25 150 H6 M12 30 V150 M9 36 L12 30 L15 36 M9 144 L12 150 L15 144"/>
      <text class="bp-label" x="130" y="186" text-anchor="middle">200</text>
      <text class="bp-label" x="20" y="94" text-anchor="middle" transform="rotate(-90 20 90)">120</text>
      <text class="bp-label" x="92" y="112">R12</text>
    </svg>

    <!-- Hex nut, top view -->
    <svg class="bp-drawing bp-hex" viewBox="0 0 160 175">
      <polygon class="bp-line s1" pathLength="1" points="135.0,80.0 107.5,127.6 52.5,127.6 25.0,80.0 52.5,32.4 107.5,32.4"/>
      <circle class="bp-line s2" pathLength="1" cx="80" cy="80" r="47.6"/>
      <circle class="bp-line s3" pathLength="1" cx="80" cy="80" r="20"/>
      <path class="bp-line s4" pathLength="1" d="M80 56 A24 24 0 1 1 56 80"/>
      <path class="bp-dim s5" pathLength="1" d="M80 14 V146 M14 80 H146"/>
      <text class="bp-label" x="80" y="168" text-anchor="middle">M24 HEX</text>
    </svg>

    <!-- Drawing title block -->
    <svg class="bp-drawing bp-title" viewBox="0 0 260 100">
      <rect class="bp-line s1" pathLength="1" x="2" y="2" width="256" height="96"/>
      <path class="bp-line s2" pathLength="1" d="M2 34 H258 M2 66 H258 M150 34 V98 M205 66 V98"/>
      <text class="bp-label" x="10" y="14">TITLE</text>
      <text class="bp-label bp-label--lg" x="10" y="28">PERSONAL PORTFOLIO</text>
      <text class="bp-label" x="10" y="46">DRAWN BY</text>
      <text class="bp-label bp-label--lg" x="10" y="60">D. NAHLIK</text>
      <text class="bp-label" x="158" y="46">DWG NO.</text>
      <text class="bp-label bp-label--lg" x="158" y="60">DN-001</text>
      <text class="bp-label" x="10" y="78">CAPA • LEAN SIX SIGMA</text>
      <text class="bp-label" x="158" y="78">SCALE</text>
      <text class="bp-label bp-label--lg" x="158" y="92">1:1</text>
      <text class="bp-label" x="213" y="78">REV</text>
      <text class="bp-label bp-label--lg" x="213" y="92">A</text>
    </svg>
  </div>

  <!-- ============ NAVIGATION ============ -->
  <header class="site-header" id="top">
    <nav class="nav container" aria-label="Primary">
      <a href="#home" class="nav__brand" data-bind="profile.initials">DN</a>

      <button class="nav__toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
      </button>

      <ul class="nav__menu" id="nav-menu">
        <li><a class="nav__link" href="#home">Home</a></li>
        <li><a class="nav__link" href="#projects">Projects &amp; Awards</a></li>
        <li><a class="nav__link" href="#skills">Skills</a></li>
        <li><a class="nav__link" href="#contact">Contact</a></li>
        <li>
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <!-- ============ 1. HOME / LANDING ============ -->
    <section class="section hero" id="home" aria-labelledby="hero-title">
      <div class="container hero__inner">
        <div class="hero__text reveal">
          <p class="hero__eyebrow" data-bind="profile.greeting"></p>
          <h1 class="hero__title" id="hero-title" data-bind="profile.name"></h1>
          <p class="hero__role" data-bind="profile.title"></p>
          <p class="hero__intro" data-bind="profile.intro"></p>
          <div class="hero__actions">
            <a href="#projects" class="btn btn--primary">View My Work</a>
            <a href="#contact" class="btn btn--ghost">Get In Touch</a>
          </div>
        </div>
        <div class="hero__media reveal">
          <img class="hero__photo" id="hero-photo" src="assets/img/headshot.jpg" alt="Portrait of David Nahlik" width="320" height="320" />
        </div>
      </div>
    </section>

    <!-- ============ 2. PROJECTS / AWARDS SHOWCASE ============ -->
    <section class="section section--alt" id="projects" aria-labelledby="projects-title">
      <div class="container">
        <header class="section__header reveal">
          <h2 class="section__title" id="projects-title">Projects &amp; Awards</h2>
          <p class="section__subtitle" data-bind="sections.projectsSubtitle"></p>
        </header>

        <div class="filters reveal" role="group" aria-label="Filter showcase">
          <button class="filter is-active" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" data-filter="project" aria-pressed="false">Projects</button>
          <button class="filter" data-filter="award" aria-pressed="false">Awards</button>
        </div>

        <div class="card-grid" id="showcase-grid" aria-live="polite"></div>
      </div>
    </section>

    <!-- ============ 3. SKILLS ============ -->
    <section class="section" id="skills" aria-labelledby="skills-title">
      <div class="container">
        <header class="section__header reveal">
          <h2 class="section__title" id="skills-title">Skills</h2>
          <p class="section__subtitle" data-bind="sections.skillsSubtitle"></p>
        </header>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <!-- ============ 4. CONTACT ============ -->
    <section class="section section--alt" id="contact" aria-labelledby="contact-title">
      <div class="container contact">
        <header class="section__header reveal">
          <h2 class="section__title" id="contact-title">Contact</h2>
          <p class="section__subtitle" data-bind="sections.contactSubtitle"></p>
        </header>

        <div class="contact__email reveal">
          <a class="btn btn--primary btn--lg" id="email-link" href="#">Email Me</a>
          <button class="btn btn--ghost" id="copy-email" type="button">Copy email</button>
          <span class="copy-status" id="copy-status" role="status" aria-live="polite"></span>
        </div>

        <ul class="contact__links reveal" id="contact-links"></ul>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>&copy; <span id="year"></span> <span data-bind="profile.name"></span>. All rights reserved.</p>
      <a href="#top" class="back-to-top">Back to top ↑</a>
    </div>
  </footer>

  <script src="js/data.js?v=2"></script>
  <script src="js/render.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
</body>
</html>
